# immo.lucien.corsica - public buy-vs-rent simulator (static site, no cookies, no backend).
# After editing: docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
server {
    listen 80;
    server_name immo.lucien.corsica;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name immo.lucien.corsica;

    ssl_certificate /etc/letsencrypt/live/immo.lucien.corsica/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immo.lucien.corsica/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker's embedded DNS + a variable: a stopped container returns 502 here
    # instead of preventing nginx from starting or reloading (which would take
    # every other site on this proxy down).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $immo_upstream http://immo:8080;

    location / {
        proxy_pass $immo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
