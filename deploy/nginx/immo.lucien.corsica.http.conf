# Phase 1 (before the certificate exists): HTTP only, with the public ACME path.
server {
    listen 80;
    server_name immo.lucien.corsica;

    # Let's Encrypt validates from anywhere: this path must stay public.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
